:1,&quot;name&quot;:&quot;Ivan Bun\u010di\u0107&quot;,&quot;text&quot;:&quot;===Aaron is communicating so clearly that my 10 year old daughter understands what he is talking about.=== Production is at the highest level I have ever seen. I first watched his MySQL course and I can see the progress Steve and Aaron are making. HP SQLite course is a pure masterpiece.&quot;,&quot;image&quot;:&quot;https:\/\/databaseschool.com\/width=48,height=48,format=webp,fit=cover\/r2\/images\/testimonials\/01KASZDF3YNTYB4AX89REQXW9A.png&quot;,&quot;html&quot;:&quot;&lt;mark&gt;Aaron is communicating so clearly that my 10 year old daughter understands what he is talking about.&lt;\/mark&gt; Production is at the highest level I have ever seen. I first watched his MySQL course and I can see the progress Steve and Aaron are making. HP SQLite course is a pure masterpiece.&quot;},{&quot;id&quot;:1,&quot;series_id&quot;:1,&quot;name&quot;:&quot;Iliyan Slavov&quot;,&quot;text&quot;:&quot;I had given up on SQLite 5 years ago, because of some false myths across the internet. Thank you Aaron for bringing me back to this powerful database! Shipped almost two apps, love the simplicity and the high performance of SQLite! ===This course is best possible investment \ud83d\ude80===&quot;,&quot;image&quot;:&quot;https:\/\/databaseschool.com\/width=48,height=48,format=webp,fit=cover\/r2\/images\/testimonials\/01KASY0G0AJ6PWZ5SP2EGKA42G.jpeg&quot;,&quot;html&quot;:&quot;I had given up on SQLite 5 years ago, because of some false myths across the internet. Thank you Aaron for bringing me back to this powerful database! Shipped almost two apps, love the simplicity and the high performance of SQLite! &lt;mark&gt;This course is best possible investment \ud83d\ude80&lt;\/mark&gt;&quot;},{&quot;id&quot;:6,&quot;series_id&quot;:1,&quot;name&quot;:&quot;Dylan Hackworth&quot;,&quot;text&quot;:&quot;Some people stray away from a course like this because they find it too niche, but really ===there are great takeaways that you can apply to other databases.=== There are sections that cover optimization like how to treat indexing and how to write better queries SQLite is also relatively smaller, so it makes it easier to digest and really understand the engine that drives your application layer. ===I think this course really hit the nail on all points=== and I highly recommend it to anyone even curious about databases in general. Also of course the Aaron Francis\/Try Hard touch always makes it a great time and interactive.&quot;,&quot;image&quot;:&quot;https:\/\/databaseschool.com\/width=48,height=48,format=webp,fit=cover\/r2\/images\/testimonials\/01KASYY09CCB723MNNWFP4TWQE.png&quot;,&quot;html&quot;:&quot;Some people stray away from a course like this because they find it too niche, but really &lt;mark&gt;there are great takeaways that you can apply to other databases.&lt;\/mark&gt; There are sections that cover optimization like how to treat indexing and how to write better queries SQLite is also relatively smaller, so it makes it easier to digest and really understand the engine that drives your application layer. &lt;mark&gt;I think this course really hit the nail on all points&lt;\/mark&gt; and I highly recommend it to anyone even curious about databases in general. Also of course the Aaron Francis\/Try Hard touch always makes it a great time and interactive.&quot;},{&quot;id&quot;:25,&quot;series_id&quot;:1,&quot;name&quot;:&quot;Viacheslav Azarov&quot;,&quot;text&quot;:&quot;It&#039;s a really well-structured course that helped me understand the intricacies of SQLite through short and easy-to-grasp videos. ===The content is on point, non-opinionated, thoughtfully presented, and has good real-life applicability.=== Thanks to Aaron and the team!&quot;,&quot;image&quot;:&quot;https:\/\/databaseschool.com\/width=48,height=48,format=webp,fit=cover\/r2\/images\/testimonials\/01KASZJSJDQFB749M07VN94ECM.png&quot;,&quot;html&quot;:&quot;It&#039;s a really well-structured course that helped me understand the intricacies of SQLite through short and easy-to-grasp videos. &lt;mark&gt;The content is on point, non-opinionated, thoughtfully presented, and has good real-life applicability.&lt;\/mark&gt; Thanks to Aaron and the team!&quot;},{&quot;id&quot;:41,&quot;series_id&quot;:1,&quot;name&quot;:&quot;Matthew Holt&quot;,&quot;text&quot;:&quot;===My SQLite performance has never been better!=== By learning the nuances about indexes and analyzing query plans, I was able to speed up a tx-heavy job from 4 hours to 4 minutes.&quot;,&quot;image&quot;:&quot;https:\/\/databaseschool.com\/width=48,height=48,format=webp,fit=cover\/r2\/images\/testimonials\/01KASZN7EZC0QHAQPP0R8XRG2M.png&quot;,&quot;html&quot;:&quot;&lt;mark&gt;My SQLite performance has never been better!&lt;\/mark&gt; By learning the nuances about indexes and analyzing query plans, I was able to speed up a tx-heavy job from 4 hours to 4 minutes.&quot;},{&quot;id&quot;:42,&quot;series_id&quot;:1,&quot;name&quot;:&quot;Mario Campos&quot;,&quot;text&quot;:&quot;===What a fantastic course on, not just SQLite, but relational databases in general!=== If you ever wanted to deep-dive head first into SQLite, and master the most ubiquitous database in the world, this is the course for you.&quot;,&quot;image&quot;:&quot;https:\/\/databaseschool.com\/width=48,height=48,format=webp,fit=cover\/r2\/images\/testimonials\/01KASZP3FSPDX37V80608BFJCJ.png&quot;,&quot;html&quot;:&quot;&lt;mark&gt;What a fantastic course on, not just SQLite, but relational databases in general!&lt;\/mark&gt; If you ever wanted to deep-dive head first into SQLite, and master the most ubiquitous database in the world, this is the course for you.&quot;},{&quot;id&quot;:43,&quot;series_id&quot;:1,&quot;name&quot;:&quot;Lawrence&quot;,&quot;text&quot;:&quot;One thing I do know is your videos are top quality. Personally, I learned 100x more from your videos than I have from previous courses on Udemy or Pluralsight, and I will always advocate for devs to take your courses.&quot;,&quot;image&quot;:&quot;https:\/\/databaseschool.com\/width=48,height=48,format=webp,fit=cover\/r2\/images\/testimonials\/01KASZQ9980KCTD8961KRQAY01.png&quot;,&quot;html&quot;:&quot;One thing I do know is your videos are top quality. Personally, I learned 100x more from your videos than I have from previous courses on Udemy or Pluralsight, and I will always advocate for devs to take your courses.&quot;},{&quot;id&quot;:36,&quot;series_id&quot;:2,&quot;name&quot;:&quot;Andrew Bass&quot;,&quot;text&quot;:&quot;Finally treated myself to mastering Postgres by Aaron Francis.\r\n\r\nI highly recommend it!\r\n\r\n===I love how each video is proving a concept - it makes the content easy to retain and engaging.===&quot;,&quot;image&quot;:null,&quot;html&quot;:&quot;Finally treated myself to mastering Postgres by Aaron Francis.\r\n\r\nI highly recommend it!\r\n\r\n&lt;mark&gt;I love how each video is proving a concept - it makes the content easy to retain and engaging.&lt;\/mark&gt;&quot;},{&quot;id&quot;:37,&quot;series_id&quot;:2,&quot;name&quot;:&quot;Adam Taylor&quot;,&quot;text&quot;:&quot;Going through the Mastering Postgres course by Aaron Francis and holy cow is it well designed.\r\n\r\nThese types of well-polished knowledge products ===bring me an immense amount of joy.===&quot;,&quot;image&quot;:null,&quot;html&quot;:&quot;Going through the Mastering Postgres course by Aaron Francis and holy cow is it well designed.\r\n\r\nThese types of well-polished knowledge products &lt;mark&gt;bring me an immense amount of joy.&lt;\/mark&gt;&quot;},{&quot;id&quot;:38,&quot;series_id&quot;:2,&quot;name&quot;:&quot;Savannah&quot;,&quot;text&quot;:&quot;Just finished Aaron Francis&#039; Mastering Postgres course. ===Highly recommend \ud83d\ude42===&quot;,&quot;image&quot;:null,&quot;html&quot;:&quot;Just finished Aaron Francis&#039; Mastering Postgres course. &lt;mark&gt;Highly recommend \ud83d\ude42&lt;\/mark&gt;&quot;},{&quot;id&quot; ng Postgres because I use Postgres a lot and wanted to support Aaron and his content. &lt;mark&gt;I already learned more than I expected and have been very impressed with the quantity and work Aaron put in.&lt;\/mark&gt;&quot;},{&quot;id&quot;:31,&quot;series_id&quot;:2,&quot;name&quot;:&quot;Dwight Watson&quot;,&quot;text&quot;:&quot;===Mastering Postgres has dramatically improved my understanding of indexes.=== It has helped me make informed decisions around my queries and schema rather than blindly adding indexes and hoping for the best.&quot;,&quot;image&quot;:&quot;https:\/\/databaseschool.com\/width=48,height=48,format=webp,fit=cover\/r2\/images\/testimonials\/01KAT01DK8ZQ6G2210MGMF2RT2.png&quot;,&quot;html&quot;:&quot;&lt;mark&gt;Mastering Postgres has dramatically improved my understanding of indexes.&lt;\/mark&gt; It has helped me make informed decisions around my queries and schema rather than blindly adding indexes and hoping for the best.&quot;},{&quot;id&quot;:32,&quot;series_id&quot;:2,&quot;name&quot;:&quot;Ryan Hendrickson&quot;,&quot;text&quot;:&quot;Mastering Postgres is single-handedly ===the most thorough and informative database course=== I\u2019ve seen. I\u2019ve gone from someone who barely knew the basics of Postgres and how it works to being comfortable with the advanced topics of Postgres.&quot;,&quot;image&quot;:&quot;https:\/\/databaseschool.com\/width=48,height=48,format=webp,fit=cover\/r2\/images\/testimonials\/01KAT02B2G6RH3PK7XCQRHNTX5.png&quot;,&quot;html&quot;:&quot;Mastering Postgres is single-handedly &lt;mark&gt;the most thorough and informative database course&lt;\/mark&gt; I\u2019ve seen. I\u2019ve gone from someone who barely knew the basics of Postgres and how it works to being comfortable with the advanced topics of Postgres.&quot;},{&quot;id&quot;:34,&quot;series_id&quot;:2,&quot;name&quot;:&quot;Kyle Bennett&quot;,&quot;text&quot;:&quot;Like many, I only dealt with databases when necessary. This course changed that, ===making me feel confident as my team&#039;s &#039;Database Expert&#039;!=== Aaron is an engaging and insightful educator, making this a 10 out of 10 course. I&#039;ll definitely buy more courses from him. Highly recommend\u2014no regrets!&quot;,&quot;image&quot;:&quot;https:\/\/databaseschool.com\/width=48,height=48,format=webp,fit=cover\/r2\/images\/testimonials\/01KAT040PFX8XHZSC12V9KQKDZ.png&quot;,&quot;html&quot;:&quot;Like many, I only dealt with databases when necessary. This course changed that, &lt;mark&gt;making me feel confident as my team&#039;s &#039;Database Expert&#039;!&lt;\/mark&gt; Aaron is an engaging and insightful educator, making this a 10 out of 10 course. I&#039;ll definitely buy more courses from him. Highly recommend\u2014no regrets!&quot;},{&quot;id&quot;:35,&quot;series_id&quot;:2,&quot;name&quot;:&quot;Lawrence&quot;,&quot;text&quot;:&quot;The course broke down complex subjects into easy-to-understand videos that I&#039;ve referred back to multiple times since completing it. It strengthened my knowledge by filling gaps and expanding into new areas I hadn&#039;t known about\u2014===absolutely worth doing!===&quot;,&quot;image&quot;:&quot;https:\/\/databaseschool.com\/width=48,height=48,format=webp,fit=cover\/r2\/images\/testimonials\/01KAT04TDWQHHXFDJRQS2FP7SB.png&quot;,&quot;html&quot;:&quot;The course broke down complex subjects into easy-to-understand videos that I&#039;ve referred back to multiple times since completing it. It strengthened my knowledge by filling gaps and expanding into new areas I hadn&#039;t known about\u2014&lt;mark&gt;absolutely worth doing!&lt;\/mark&gt;&quot;},{&quot;id&quot;:39,&quot;series_id&quot;:2,&quot;name&quot;:&quot;Daniel Bachhuber&quot;,&quot;text&quot;:&quot;Really enjoying Aaron Francis&#039; \&quot;Mastering Postgres\&quot;. ===It&#039;s information-dense, very approachable, and well-produced.===&quot;,&quot;image&quot;:&quot;https:\/\/databaseschool.com\/width=48,height=48,format=webp,fit=cover\/r2\/images\/testimonials\/01KAT05QV7BPEW2RZVQ77VEYM7.png&quot;,&quot;html&quot;:&quot;Really enjoying Aaron Francis&#039; \&quot;Mastering Postgres\&quot;. &lt;mark&gt;It&#039;s information-dense, very approachable, and well-produced.&lt;\/mark&gt;&quot;},{&quot;id&quot;:40,&quot;series_id&quot;:2,&quot;name&quot;:&quot;Kjell Kind&quot;,&quot;text&quot;:&quot;===Loved watching the PG course!=== Perfect if you come from a MySQL background, and to get up to speed in PG.&quot;,&quot;image&quot;:&quot;https:\/\/databaseschool.com\/width=48,height=48,format=webp,fit=cover\/r2\/images\/testimonials\/01KAT06QRKQDT50TC95250Y4VE.png&quot;,&quot;html&quot;:&quot;&lt;mark&gt;Loved watching the PG course!&lt;\/mark&gt; Perfect if you come from a MySQL background, and to get up to speed in PG.&quot;},{&quot;id&quot;:44,&quot;series_id&quot;:2,&quot;name&quot;:&quot;J\u00f6rn&quot;,&quot;text&quot;:&quot;After watching the free lessons, buying the course was a no-brainer. ===It gave me real insight, so I actually understand why I\u2019m doing something, not just how.===&quot;,&quot;image&quot;:&quot;https:\/\/databaseschool.com\/width=48,height=48,format=webp,fit=cover\/r2\/images\/testimonials\/01KAT07E2MJYP2104VA5JJ5720.png&quot;,&quot;html&quot;:&quot;After watching the free lessons, buying the course was a no-brainer. &lt;mark&gt;It gave me real insight, so I actually understand why I\u2019m doing something, not just how.&lt;\/mark&gt;&quot;},{&quot;id&quot;:46,&quot;series_id&quot;:2,&quot;name&quot;:&quot;Yoram Kornatzky&quot;,&quot;text&quot;:&quot;I did not touch Postgres for more than 5 years. This course brought me back to the state of the art. It is comprehensive and covers the latest AI-related stuff. Highly recommended. Have a Ph.D. in Computer Science on database systems. More than 25 years of industrial experience.&quot;,&quot;image&quot;:&quot;https:\/\/databaseschool.com\/width=48,height=48,format=webp,fit=cover\/r2\/images\/testimonials\/01KAT088K8RZPZ7H47DRMX6R55.png&quot;,&quot;html&quot;:&quot;I did not touch Postgres for more than 5 years. This course brought me back to the state of the art. It is comprehensive and covers the latest AI-related stuff. Highly recommended. Have a Ph.D. in Computer Science on database systems. More than 25 years of industrial experience.&quot;},{&quot;id&quot;:27,&quot;series_id&quot;:1,&quot;name&quot;:&quot;Przemyslaw Figura&quot;,&quot;text&quot;:&quot;Fantastic! So much packed into one course. ===Full-text search was a cherry on top of what&#039;s possible with SQLite.=== The course opened my mind to completely new ideas, and gave me perspective on databases in general.&quot;,&quot;image&quot;:&quot;https:\/\/databaseschool.com\/width=48,height=48,format=webp,fit=cover\/r2\/images\/testimonials\/01KASZM4BC31X9Q3DS5ZM8P9R4.png&quot;,&quot;html&quot;:&quot;Fantastic! So much packed into one course. &lt;mark&gt;Full-text search was a cherry on top of what&#039;s possible with SQLite.&lt;\/mark&gt; The course opened my mind to completely new ideas, and gave me perspective on databases in general.&quot;},{&quot;id&quot;:45,&quot;series_id&quot;:1,&quot;name&quot;:&quot;Yoram Kornatzky&quot;,&quot;text&quot;:&quot;My background in databases goes back more than 30 years to my Computer Science PhD. High Performance SQLite course by Aaron Francis is ===one of the best technical courses I ever had.=== It brought me up to speed on SQLite and along the way refreshed my knowledge of databases in general.&quot;,&quot;image&quot;:&quot;https:\/\/databaseschool.com\/width=48,height=48,format=webp,fit=cover\/r2\/images\/testimonials\/01KASZR2TWM545JPKGX4B6X6B5.png&quot;,&quot;html&quot;:&quot;My background in databases goes back more than 30 years to my Computer Science PhD. High Performance SQLite course by Aaron Francis is &lt;mark&gt;one of the best technical courses I ever had.&lt;\/mark&gt; It brought me up to speed on SQLite and along the way refreshed my knowledge of databases in general.&quot;},{&quot;id&quot;:33,&quot;series_id&quot;:2,&quot;name&quot;:&quot;Peter Ramsing&quot;,&quot;text&quot;:&quot;Mastering Postgres is such a crisp way to learn this subject. With today\u2019s AI tools writing many of the queries via autocomplete it\u2019s vital to have this knowledge to ensure you know what\u2019s actually happening under the hood. ===My app\u2019s performance improved overnight after learning more about indexing.=== Aaron\u2019s excitement for the subject makes it really fun to learn whether I\u2019m next to my code editor or on a treadmill run.&quot;,&quot;image&quot;:&quot;https:\/\/databaseschool.com\/width=48,height=48,format=webp,fit=cover\/r2\/images\/testimonials\/01KAT035WSR4MJBS0PNGEP9CB8.png&quot;,&quot;html&quot;:&quot;Mastering Postgres is such a crisp way to learn this subject. With today\u2019s AI tools writing many of the queries via autocomplete it\u2019s vital to have this knowledge to ensure you know what\u2019s actually happening under the hood. &lt;mark&gt;My app\u2019s performance improved overnight after learning more about indexing.&lt;\/mark&gt; Aaron\u2019s excitement for the subject makes it really fun to learn whether I\u2019m next to my code editor or on a treadmill run.&quot;},{&quot;id&quot;:47,&quot;series_id&quot;:4,&quot;name&quot;:&quot;Joe Lennon&quot;,&quot;text&quot;:&quot;I\u2019ve been working with databases and SQL for almost 20 years and I learned a ton from this. ===Any developer who writes code that interacts with a database should take the time to go through this course - it\u2019s brilliant.===&quot;,&quot;image&quot;:&quot;https:\/\/databaseschool.com\/width=48,height=48,format=webp,fit=cover\/r2\/images\/testimonials\/01KAVP9EXZ2BWN32JKJSS4AHDG.jpg&quot;,&quot;html&quot;:&quot;I\u2019ve been working with databases and SQL for almost 20 years and I learned a ton from this. &lt;mark&gt;Any developer who writes code that interacts with a database should take the time to go through this course - it\u2019s brilliant.&lt;\/mark&gt;&quot;},{&quot;id&quot;:48,&quot;series_id&quot;:4,&quot;name&quot;:&quot;Anthony Clark&quot;,&quot;text&quot;:&quot;===The quality of these free videos is truly impressive,=== and yet it still feels like Aaron Francis just jumped on a zoom call to teach me, very friendly and approachable teaching style. \ud83d\udc4f&quot;,&quot;image&quot;:&quot;https:\/\/databaseschool.com\/width=48,height=48,format=webp,fit=cover\/r2\/images\/testimonials\/01KAVPEEJKKQDGWQF90CRSFFZR.jpg&quot;,&quot;html&quot;:&quot;&lt;mark&gt;The quality of these free videos is truly impressive,&lt;\/mark&gt; and yet it still feels like Aaron Francis just jumped on a zoom call to teach me, very friendly and approachable teaching style. \ud83d\udc4f&quot;},{&quot;id&quot;:49,&quot;series_id&quot;:4,&quot;name&quot;:&quot;Chris Kindred&quot;,&quot;text&quot;:&quot;This is a great resource. Thank you!&quot;,&quot;image&quot;:&quot;https:\/\/databaseschool.com\/width=48,height=48,format=webp,fit=cover\/r2\/images\/testimonials\/01KAVPGSQF6SV9D6EWN5REEK53.jpg&quot;,&quot;html&quot;:&quot;This is a great resource. Thank you!&quot;},{&quot;id&quot;:50,&quot;series_id&quot;:4,&quot;name&quot;:&quot;Alex Six&quot;,&quot;text&quot;:&quot;Massive congratulations to Aaron Francis for launching this immense course! ===Can\u2019t wait to dig in and learn a ton! \ud83c\udf89\ud83c\udf89\ud83c\udf89===&quot;,&quot;image&quot;:&quot;https:\/\/databaseschool.com\/width=48,height=48,format=webp,fit=cover\/r2\/images\/testimonials\/01KAVPJJB7KPES0NDRC35V7GPQ.jpg&quot;,&quot;html&quot;:&quot;Massive congratulations to Aaron Francis for launching this immense course! &lt;mark&gt;Can\u2019t wait to dig in and learn a ton! \ud83c\udf89\ud83c\udf89\ud83c\udf89&lt;\/mark&gt;&quot;},{&quot;id&quot;:51,&quot;series_id&quot;:4,&quot;name&quot;:&quot;Tr\u00e9sor Kasenda&quot;,&quot;text&quot;:&quot;Best course to learn&quot;,&quot;image&quot;:&quot;https:\/\/databaseschool.com\/width=48,height=48,format=webp,fit=cover\/r2\/images\/testimonials\/01KAVPQ0P6SC5H1NMQHWK0KRB7.jpg&quot;,&quot;html&quot;:&quot;Best course to learn&quot;},{&quot;id&quot;:52,&quot;series_id&quot;:3,&quot;name&quot;:&quot;Serge Mosin&quot;,&quot;text&quot;:&quot;Found the new Database course by Aaron Francis. As a Ph.D. in Database theory, I saw a lot of different learning materials over my 13 years in the field, but this one seems like one of the best courses, especially for beginners.\n\nI like attention to detail there. For instance, \&quot;the Orphaned data\&quot; chapter talks about data missing due to inner joins, which might be easily overlooked. However, it&#039;s smth my supervisor used to specifically point out, saying that \&quot;The absence of data is also a subject of data analysis\&quot;.&quot;,&quot;image&quot;:&quot;https:\/\/databaseschool.com\/width=48,height=48,format=webp,fit=cover\/r2\/images\/testimonials\/01KBD5K7203CYNP6S38K5VSENN.jpg&quot;,&quot;html&quot;:&quot;Found the new Database course by Aaron Francis. As a Ph.D. in Database theory, I saw a lot of different learning materials over my 13 years in the field, but this one seems like one of the best courses, especially for beginners.\n\nI like attention to detail there. For instance, \&quot;the Orphaned data\&quot; chapter talks about data missing due to inner joins, which might be easily overlooked. However, it&#039;s smth my supervisor used to specifically point out, saying that \&quot;The absence of data is also a subject of data analysis\&quot;.&quot;}],&quot;faqs&quot;:[{&quot;title&quot;:&quot;Are these series live?&quot;,&quot;content&quot;:&quot;&lt;p&gt;No, all series are pre-recorded, allowing you to learn at your own pace. Many series include interactive playgrounds for hands-on practice, and we&#039;re launching a community forum soon to help you connect with other learners.&lt;\/p&gt;\n&quot;},{&quot;title&quot;:&quot;How do I know what series is right for me?&quot;,&quot;content&quot;:&quot;&lt;p&gt;Every series begins with several free videos, giving you a chance to explore the content and teaching style before diving in. Plus, with the All Access Pass, you don&#039;t have to choose\u2014you get unlimited access to every series in our library.&lt;\/p&gt;\n&quot;},{&quot;title&quot;:&quot;Can I take these with a full-time job?&quot;,&quot;content&quot;:&quot;&lt;p&gt;Absolutely. Each video is designed as a self-contained unit of knowledge, averaging just 7-10 minutes in length. This bite-sized format makes it easy to fit learning into a busy schedule\u2014even if you only have time for one or two videos a day.&lt;\/p&gt;\n&quot;},{&quot;title&quot;:&quot;Is this an accredited program?&quot;,&quot;content&quot;:&quot;&lt;p&gt;No, this is not an accredited academic program. While &amp;quot;Database School&amp;quot; sounds official, we&#039;re focused on practical, real-world skills for developers rather than degrees or certificates. Think of it as a school of thought, not a university.&lt;\/p&gt;\n&quot;},{&quot;title&quot;:&quot;I&#039;m having issues with the series. Who can I contact?&quot;,&quot;content&quot;:&quot;&lt;p&gt;Oh no! Send us an email at &lt;a href=\&quot;mailto:hello@databaseschool.com\&quot; class=\&quot;underline decoration-gray-dark\/50 hover:decoration-gray-dark\&quot;&gt;&lt;a href=\&quot;mailto:hello@databaseschool.com\&quot;&gt;hello@databaseschool.com&lt;\/a&gt;&lt;\/a&gt;.&lt;\/p&gt;\n&quot;},{&quot;title&quot;:&quot;Is there a free trial available?&quot;,&quot;content&quot;:&quot;&lt;p&gt;There are several free videos, but no free trial. If you aren\u2019t fully satisfied with the series, just ask for your money back\u2014no problem.&lt;\/p&gt;\n&quot;},{&quot;title&quot;:&quot;I bought the All Access Pass but I&#039;m not happy. Can I get a refund?&quot;,&quot;content&quot;:&quot;&lt;p&gt;We want you to be completely satisfied with your purchase. If you&#039;re not happy, we offer a 30-day money-back guarantee. Just email us at &lt;a href=\&quot;mailto:hello@databaseschool.com\&quot; class=\&quot;underline decoration-gray-dark\/50 hover:decoration-gray-dark\&quot;&gt;&lt;a href=\&quot;mailto:hello@databaseschool.com\&quot;&gt;hello@databaseschool.com&lt;\/a&gt;&lt;\/a&gt; and we&#039;ll refund your payment, no questions asked.&lt;\/p&gt;\n&quot;},{&quot;title&quot;:&quot;Can I get an invoice?&quot;,&quot;content&quot;:&quot;&lt;p&gt;Absolutely! After making a purchase we will automatically email you a receipt. If you need a more detailed invoice, just &lt;a href=\&quot;mailto:hello@databaseschool.com\&quot; class=\&quot;underline decoration-gray-dark\/50 hover:decoration-gray-dark\&quot;&gt;email us&lt;\/a&gt;.&lt;\/p&gt;\n&quot;},{&quot;title&quot;:&quot;Do I get access to the series forever?&quot;,&quot;content&quot;:&quot;&lt;p&gt;Yes. The All Access Pass is a one-time payment, not a subscription. Pay once and you keep access to every series in the library, including new content as it&#039;s added.&lt;\/p&gt;\n&quot;},{&quot;title&quot;:&quot;What if I previously purchased Mastering Postgres or High Performance SQLite?&quot;,&quot;content&quot;:&quot;&lt;p&gt;If you bought either of those individual courses before Database School existed, you still have access to them. If you bought it, you own it forever. If you don&#039;t see a course in your account, please email us at &lt;a href=\&quot;mailto:hello@databaseschool.com\&quot; class=\&quot;underline decoration-gray-dark\/50 hover:decoration-gray-dark\&quot;&gt;&lt;a href=\&quot;mailto:hello@databaseschool.com\&quot;&gt;hello@databaseschool.com&lt;\/a&gt;&lt;\/a&gt; and we&#039;ll get it sorted out.&lt;\/p&gt;\n&quot;},{&quot;title&quot;:&quot;Do you offer discounts?&quot;,&quot;content&quot;:&quot;&lt;p&gt;Sure, if you live in a country where the USD price is too high or if you are a student, don&#039;t hesitate to &lt;a href=\&quot;mailto:hello@databaseschool.com\&quot; class=\&quot;underline decoration-gray-dark\/50 hover:decoration-gray-dark\&quot;&gt;email us&lt;\/a&gt;!&lt;\/p&gt;\n&quot;},{&quot;title&quot;:&quot;I had a yearly subscription. What happens now?&quot;,&quot;content&quot;:&quot;&lt;p&gt;Your access is now permanent. We&#039;ve switched off renewal, so you won&#039;t be charged again and you keep access to everything. Questions? Email us at &lt;a href=\&quot;mailto:hello@databaseschool.com\&quot; class=\&quot;underline decoration-gray-dark\/50 hover:decoration-gray-dark\&quot;&gt;&lt;a href=\&quot;mailto:hello@databaseschool.com\&quot;&gt;hello@databaseschool.com&lt;\/a&gt;&lt;\/a&gt;.&lt;\/p&gt;\n&quot;}],&quot;logos&quot;:[&quot;\/images\/logos\/storyblok.svg&quot;,&quot;\/images\/logos\/workleap.svg&quot;,&quot;\/images\/logos\/mainmatter.svg&quot;,&quot;\/images\/logos\/lego.svg&quot;,&quot;\/images\/logos\/remote.svg&quot;,&quot;\/images\/logos\/mercury.svg&quot;,&quot;\/images\/logos\/resend.svg&quot;,&quot;\/images\/logos\/laravel.svg&quot;,&quot;\/images\/logos\/recursion.svg&quot;,&quot;\/images\/logos\/stripe.svg&quot;,&quot;\/images\/logos\/gitlab.svg&quot;,&quot;\/images\/logos\/salesforce-wordmark.png&quot;],&quot;pricing&quot;:{&quot;single&quot;:{&quot;product_id&quot;:&quot;prod_TSUW0Cf32pvy3L&quot;,&quot;name&quot;:&quot;Database School - Solo&quot;,&quot;seats&quot;:1,&quot;amount&quot;:269,&quot;formatted&quot;:&quot;$269&quot;,&quot;interval&quot;:&quot;year&quot;},&quot;teams&quot;:[{&quot;product_id&quot;:&quot;prod_TSUe1gZENm7oaB&quot;,&quot;name&quot;:&quot;Database School - 5 seats&quot;,&quot;seats&quot;:5,&quot;amount&quot;:1199,&quot;formatted&quot;:&quot;$1,199&quot;,&quot;interval&quot;:&quot;year&quot;},{&quot;product_id&quot;:&quot;prod_TSUfZC5YNyePei&quot;,&quot;name&quot;:&quot;Database School - 10 seats&quot;,&quot;seats&quot;:10,&quot;amount&quot;:2199,&quot;formatted&quot;:&quot;$2,199&quot;,&quot;interval&quot;:&quot;year&quot;},{&quot;product_id&quot;:&quot;prod_TSUgvTeThqo5zl&quot;,&quot;name&quot;:&quot;Database School - 25 seats&quot;,&quot;seats&q
