<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">GlobalLand.si</title>
  <desc id="desc">Cinq points reliés autour d’un monde commun. Un monde à construire. Une survie à prouver.</desc>
