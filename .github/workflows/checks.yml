name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tests/runtime.test.js
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: bash -n scripts/setup_vps.sh scripts/queue_runner.sh scripts/daily_audit.sh
