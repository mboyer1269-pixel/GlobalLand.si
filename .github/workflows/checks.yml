name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tests/runtime.test.js
      - run: node tests/executor.test.js
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify private log rotation with an open writer in an isolated directory
        run: |
          if ! command -v logrotate >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y logrotate
          fi
          sudo env GLOBALLAND_LOGROTATE_SMOKE=1 python3 -B -m unittest discover -s tests -p test_install_maintenance.py -k real_logrotate
      - run: docker pull node:22-bookworm
      - run: python3 -m unittest discover -s tests -p 'test_docker_smoke.py'
        env:
          GLOBALLAND_DOCKER_SMOKE: '1'
      - run: python3 -m unittest discover -s tests -p 'test_private_service_assets.py'
        env:
          GLOBALLAND_DOCKER_SMOKE: '1'
      - run: python3 -m unittest discover -s tests -p 'test_catalog_supervisor.py'
        env:
          GLOBALLAND_DOCKER_SMOKE: '1'
      - run: for f in scripts/*.sh; do bash -n "$f" || exit 1; done
  bootstrap-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse an existing or non-disposable host
        id: host-preflight
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          for path in /opt/globalland /etc/cron.d/globalland /etc/cron.d/globalland-think /etc/logrotate.d/globalland /var/log/globalland; do
            test ! -e "$path" && test ! -L "$path"
          done
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare disposable host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cron logrotate acl
          # Prepare trusted ancestors on this disposable host only. Keep /opt's
          # default ACL so the fresh-root isolation regression stays exercised.
          sudo chmod 755 /opt /var/log
          sudo systemctl start cron logrotate.timer
          docker compose version
          docker pull node:22-bookworm
      - name: Verify real bootstrap without productive cycles
        run: |
          set -euo pipefail
          digest=$(docker image inspect node:22-bookworm --format '{{index .RepoDigests 0}}')
          sudo env PATH="$PATH" GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GLOBALLAND_BOOTSTRAP_SMOKE=1 \
            GLOBALLAND_BOOTSTRAP_IMAGE="node:22-bookworm@${digest##*@}" \
            python3 tests/bootstrap_install_smoke.py
      - name: Show only installation permission metadata on failure
        if: ${{ failure() && steps.host-preflight.outcome == 'success' }}
        run: |
          for path in /opt /opt/globalland /opt/globalland/control /opt/globalland/ssh /opt/globalland/state /opt/globalland/backups /opt/globalland/source.git /var /var/log /etc /etc/cron.d /etc/logrotate.d; do
            if test -d "$path"; then
              sudo stat -c '%a %A %U:%G %n' "$path"
              sudo getfacl --absolute-names "$path"
            fi
          done
      - name: Stop disposable scheduler and all children
        if: ${{ always() && steps.host-preflight.outcome == 'success' }}
        run: |
          sudo systemctl kill --kill-whom=all --signal=SIGKILL cron.service || true
          sudo systemctl stop cron.service
  actor-products:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        actor: [rss-reader, link-checker, domain-availability, csv-preflight]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned Actor SDK
        run: python3 -m pip install -r products/actors/${{ matrix.actor }}/requirements.txt
      - name: Test the product core
        run: python3 products/actors/${{ matrix.actor }}/tests/run_tests.py
      - name: Test public network restrictions
        run: python3 -m unittest discover -s tests -p 'test_actor_network.py'
      - name: Execute the real SDK wrapper locally (no billing)
        run: python3 tests/actor_sdk_smoke.py --actor '${{ matrix.actor }}'
